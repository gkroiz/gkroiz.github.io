  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, sans-serif;
      font-weight: 300;
      color: #000000;
      line-height: 1.6;
      background-color: #1a1a18;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #f5f5f0;
      clip-path: polygon(0 0, 100% 0, 0 100%);
      z-index: -1;
    }

    .cv-section {
      max-width: 900px;
      margin: 0 auto;
      padding: 4rem 2rem;
      min-height: 100vh;
      mix-blend-mode: difference;
      color: #ffffff;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 300;
      margin-bottom: 2rem;
    }

    .pdf-viewer {
      width: 100%;
      border: 1px solid #e5e5e5;
      border-radius: 0;
      background-color: #ffffff;
      mix-blend-mode: normal;
      isolation: isolate;
    }

    a {
      color: inherit;
      text-decoration: underline;
      transition: opacity 0.2s ease;
    }

    a:hover {
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .cv-section {
        padding: 3rem 1.5rem;
      }

      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
